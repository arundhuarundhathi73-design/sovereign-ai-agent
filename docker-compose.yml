version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sovereign-agent-db
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: sovereign-agent-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://agent_user:secure_password@db:5432/agent_db
      WALLET_PROVIDER: mock
      WALLET_API_KEY: ""
      WALLET_CURRENCY: USD
      LOW_BALANCE_THRESHOLD: "10.0"
      SHUTDOWN_BALANCE_THRESHOLD: "2.0"
      DAILY_BUDGET: "100.0"
      MIN_NET_PROFIT: "500.0"
      CHILD_SEED_FUNDING: "50.0"
      ENVIRONMENT: development
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

volumes:
  postgres_data:
